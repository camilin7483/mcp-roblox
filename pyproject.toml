[project]
name = "mcp-roblox"
version = "0.2.0"
description = "MCP gateway for Roblox Studio editing, Luau scripting, and playtesting"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "cam"}]
dependencies = ["mcp>=1.3,<2", "pydantic>=2.0,<3"]

[project.scripts]
mcp-roblox = "server:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server", "precision", "planner", "verifier", "autonomy"]
packages = ["backends"]
